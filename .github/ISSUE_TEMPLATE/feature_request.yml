name: Feature request
description: Suggest a new command, encoding, or API improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behavior
      description: For new commands, please reference the ESC/POS command (e.g. "GS ( k function 180") and which printers support it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: e.g. whether `.custom()` already covers this and why it is not enough.
